<!doctype html><meta charset="utf-8"><title>s8</title>
<script>
  window.__log = [];
  const t = () => Date.now() - 946684800000;
  window.timers = () => { for (const ms of [100, 200, 300, 400, 600, 800]) setTimeout(() => window.__log.push(["timer" + ms, t()]), ms); };
  window.go = () => { window.__log.push(["issued", t()]); fetch("https://api.example.test/x").then(r => r.text()).then(() => window.__log.push(["done", t()])).catch(e => window.__log.push(["failed", t()])); };
</script>
