[package]
name = "frontcap-adapter-chromium"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "frontcap_chromium"

[dependencies]
frontcap-proxy = { path = "../proxy" }
cdp = { path = "../cdp" }
browser-pin = { path = "../browser-pin" }
frontcap-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
png.workspace = true

[features]
# Hooks for this crate's own integration tests.
test-hooks = ["cdp/test-hooks"]
# Process-loss oracles at native exception receipt publication boundaries.
fault-injection = ["cdp/test-hooks"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
frontcap-adapter-chromium = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
tiny_http.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite.workspace = true
futures-util.workspace = true
