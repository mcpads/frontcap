<!doctype html><meta charset="utf-8"><title>frames idle</title>
<style>
  #box { width: 50px; height: 50px; opacity: 0; transition: opacity 200ms linear; }
  #box.on { opacity: 1; }
</style>
<div id="box"></div>
<script>
  // No animation frame loop: between transitions the page asks for no frame.
  window.__events = [];
  const t = () => Date.now() - 946684800000;
  const box = document.getElementById("box");
  box.addEventListener("transitionrun", () => window.__events.push(["transitionrun", t()]));
  box.addEventListener("transitionend", () => window.__events.push(["transitionend", t()]));
  window.start = () => requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("on")));
  window.later = (ms) => setTimeout(start, ms);
  window.fetched = () => fetch("https://api.example.test/go").then(start, start);
  // A timer whose task posts another at the same instant (as a scheduler built on MessageChannel does).
  window.viaChannel = (ms) => setTimeout(() => {
    const c = new MessageChannel();
    c.port1.onmessage = () => box.classList.add("on");
    c.port2.postMessage(0);
  }, ms);
</script>
