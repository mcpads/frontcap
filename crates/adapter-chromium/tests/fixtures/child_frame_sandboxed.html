<!doctype html><meta charset="utf-8"><title>sandboxed</title>
<!-- A message rendered as webmail does: a sandboxed frame that runs no script, with a form and a link. -->
<iframe id="mail" title="Mail" sandbox="allow-forms" srcdoc="<form action='https://mail.test/reply'><input id=reply name=r><button id=send>Send</button></form><p id=sig>Regards</p>"></iframe>
