<!doctype html><meta charset="utf-8"><title>Visual targets</title>
<style>
body { margin: 0 }
iframe { position: absolute; left: 0; top: 0; border: 0; width: 300px; height: 200px;
         transform: translate(300px, 0) rotate(90deg); transform-origin: 0 0 }
canvas { position: absolute; left: 400px; top: 20px; background: navy }
</style>
<iframe srcdoc="<button id='target' style='position:absolute;left:20px;top:30px;width:100px;height:40px;margin:0' onclick='this.textContent=&quot;Clicked&quot;'>Target</button>"></iframe>
<canvas width="100" height="80" aria-label="Drawing"></canvas>

<script>
  const canvas = document.querySelector('canvas');
  canvas.dataset.clicks = '0';
  canvas.addEventListener('click', event => {
    canvas.dataset.clicks = String(Number(canvas.dataset.clicks) + 1);
    canvas.dataset.x = String(event.offsetX);
    canvas.dataset.trusted = String(event.isTrusted);
  });
</script>
