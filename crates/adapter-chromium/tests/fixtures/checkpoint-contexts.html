<!doctype html>
<meta charset="utf-8">
<title>Execution checkpoint oracle: a stream and a frame</title>
<button id="open">Open the feed</button>
<button id="step">Change hidden state</button>
<output id="stream">closed</output>
<output id="frame">pending</output>
<iframe id="child" srcdoc="<script>
  let ticks = 0, secret = 0;
  onmessage = ({data}) => { if (data === 'step') secret++; };
  setInterval(() => parent.postMessage(`${++ticks}:${secret}`, '*'), 200);
</script>"></iframe>
<script>
(() => {
  // Neither the feed's messages nor the hidden steps are kept anywhere but these closures, the frame's
  // and the platform's scripted stream.
  let secret = 0, received = 0, last = '';
  addEventListener('message', ({data, source}) => {
    if (source === document.querySelector('#child').contentWindow) document.querySelector('#frame').textContent = data;
  });
  document.querySelector('#open').onclick = () => {
    const feed = new WebSocket('wss://stream.test/feed');
    feed.onmessage = ({data}) => {
      received++;
      last = data;
      document.querySelector('#stream').textContent = `${received}:${last}:${secret}`;
    };
  };
  document.querySelector('#step').onclick = () => {
    secret++;
    document.querySelector('#child').contentWindow.postMessage('step', '*');
  };
})();
</script>
