<!doctype html><meta charset="utf-8"><title>worker zero-latency fetch then import</title>
<script>
  // A worker with a fetch answered at once (0 ms) in flight while it imports a script synchronously (20 ms).
  window.got = [];
  const t = () => Date.now() - 946684800000;
  const src = `const now = () => Date.now() - 946684800000; fetch("https://api.example.test/z").then(r => r.text()).then(b => postMessage([b, now()])); importScripts("https://api.example.test/lib.js"); postMessage(["imported", now()]);`;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  w.onmessage = (e) => got.push([...e.data, t()]);
</script>
