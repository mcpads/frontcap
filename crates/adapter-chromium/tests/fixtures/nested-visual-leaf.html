<!doctype html><meta charset="utf-8"><title>cross-origin shadow controls</title>
<style>body { margin:0; } #host { display:contents; }</style>
<div id="host"></div>
<script>
const shadow = document.querySelector('#host').attachShadow({mode:'open'});
shadow.innerHTML = `<style>
  button, canvas { position:absolute; left:20px; width:100px; height:40px; margin:0; padding:0; border:0; }
  button { top:40px; background:red; } canvas { top:100px; background:navy; }
</style><button id="target" data-clicks="0">Target</button><canvas width="100" height="40" aria-label="Nested canvas" data-clicks="0"></canvas>`;
for (const element of shadow.querySelectorAll('button, canvas')) {
  element.addEventListener('click', event => {
    element.dataset.clicks = String(Number(element.dataset.clicks) + 1);
    element.dataset.x = String(event.offsetX);
    element.dataset.y = String(event.offsetY);
    element.dataset.trusted = String(event.isTrusted);
    if (element.localName === 'button') element.textContent = 'Clicked';
  });
}
</script>
