<!doctype html><meta charset="utf-8"><title>frames</title>
<style>
  #box { width: 50px; height: 50px; opacity: 0; transition: opacity 200ms linear; }
  #box.on { opacity: 1; }
</style>
<div id="box"></div>
<script>
  window.__frames = [];
  window.__events = [];
  const t = () => Date.now() - 946684800000;
  const loop = () => { window.__frames.push(t()); if (window.__frames.length < 200) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const box = document.getElementById("box");
  box.addEventListener("transitionrun", () => window.__events.push(["transitionrun", t()]));
  box.addEventListener("transitionend", () => window.__events.push(["transitionend", t()]));
  window.startTransition = () => requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("on")));
</script>
