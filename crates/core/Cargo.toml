[package]
name = "frontcap-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "frontcap_core"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
sha2.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Scoped subprocess-only storage fault oracles; absent in production builds.
fault-injection = []
# JSON schemas for the types control surfaces accept.
schema = ["dep:schemars"]

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
