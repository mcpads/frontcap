<!doctype html><meta charset="utf-8"><title>api</title>
<script>
  // Calls the API at `?api=<origin>` on request; each answer (or "failed") is kept in order.
  const api = new URLSearchParams(location.search).get("api");
  window.got = [];
  window.call = (path) => { fetch(api + path).then((r) => r.text()).then((t) => got.push(t), () => got.push("failed")); return 0; };
</script>
