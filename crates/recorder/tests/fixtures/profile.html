<!doctype html><meta charset="utf-8"><title>Profile</title>
<style>.toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 8px 16px; }</style>
<h1>Profile</h1>
<label>Name <input id="name" value="Ada"></label>
<button id="save">Save</button>
<script>
  document.getElementById("save").addEventListener("click", async () => {
    const res = await fetch("https://api.example.test/profile", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: document.getElementById("name").value }) });
    if (!res.ok) return;
    setTimeout(() => {
      const t = document.createElement("div");
      t.className = "toast"; t.setAttribute("role", "status"); t.textContent = "Saved";
      document.body.appendChild(t);
    }, 300);
  });
</script>
