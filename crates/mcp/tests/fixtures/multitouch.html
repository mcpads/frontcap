<!doctype html><meta charset="utf-8"><title>Controlled multitouch</title>
<style>body{margin:0}#pad{position:absolute;left:20px;top:20px;width:300px;height:180px;background:silver;touch-action:none}iframe{position:absolute;left:0;top:0;border:0;width:600px;height:300px}</style>
<div id="pad">pinch target</div><output id="events">[]</output><output id="timer">pending</output><output id="distance">0</output><output id="clicks">0</output>
<script>
if(location.search==='?parent'){
  document.querySelector('#pad').remove();
  const f=document.createElement('iframe');f.id='child';f.src=`http://localhost:${location.port}${location.pathname}`;document.body.append(f);
}else{
  const seen=[];const points=list=>Array.from(list,t=>[t.identifier,t.clientX,t.clientY]).sort((a,b)=>a[0]-b[0]);
  const pad=document.querySelector('#pad');
  for(const type of ['touchstart','touchmove','touchend','touchcancel'])pad.addEventListener(type,e=>{
    e.preventDefault();
    seen.push([type,points(e.touches),points(e.changedTouches),e.isTrusted,Date.now()-946684800000]);
    document.querySelector('#events').textContent=JSON.stringify(seen);
    if(e.touches.length===2)document.querySelector('#distance').textContent=Math.abs(e.touches[1].clientX-e.touches[0].clientX);
    if(type==='touchstart')setTimeout(()=>document.querySelector('#timer').textContent='fired',50);
  },{passive:false});
  pad.onclick=()=>document.querySelector('#clicks').textContent=Number(document.querySelector('#clicks').textContent)+1;
}
</script>
