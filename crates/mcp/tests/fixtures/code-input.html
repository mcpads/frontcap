<!doctype html><meta charset="utf-8"><title>Code</title>
<code-input></code-input><button id="go">Go</button>
<script>
// Three one-digit fields in a closed root; each typed digit moves focus to the next field, the last to Go.
customElements.define('code-input', class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({mode: 'closed'});
    root.innerHTML = [1, 2, 3].map((i) => `<input aria-label="Digit ${i}" maxlength="1">`).join('');
    const fields = [...root.querySelectorAll('input')];
    fields.forEach((f, i) => f.addEventListener('input', () => (fields[i + 1] || document.getElementById('go')).focus()));
  }
});
</script>
