<!doctype html><meta charset="utf-8"><title>type</title>
<form id="f"><input id="q" aria-label="Query"><button type="submit">Send</button></form>
<p id="out"></p>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value;
    setTimeout(() => { document.getElementById("out").textContent = "sent " + q; }, 200);
  });
</script>
